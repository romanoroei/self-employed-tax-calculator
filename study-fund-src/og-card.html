<!-- Share image template: serve from business-site at 1200x630 and screenshot to assets/img/study-fund-share.jpg -->
<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#F1F1EE;font-family:Heebo,Arial,sans-serif;display:grid;grid-template-columns:1fr 360px;gap:10px;padding:10px}
.ink{background:#0C2134;color:#F1F1EE;padding:54px 60px;display:flex;flex-direction:column;gap:22px}
.k{display:flex;align-items:center;gap:14px;color:#C9B772;font-size:28px;font-weight:700}
.k img{width:56px}
h1{font-size:64px;line-height:1.38;font-weight:800;letter-spacing:-.01em}
.cap{margin-top:auto;font-size:26px;color:#C1CEDB;font-weight:500}
.side{display:grid;grid-template-rows:1fr auto;gap:10px}
.side img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;min-height:0}
.gold{background:#C9B772;color:#081826;padding:22px 26px}
.gold strong{display:block;font-size:30px;font-weight:800}
.gold span{font-size:22px;font-weight:500}
</style></head><body>
<div class="ink">
  <p class="k"><img src="assets/arbitrage-mark.png" alt="">בדיקת קרן השתלמות לעצמאים</p>
  <h1>עצמאי? כמה עוד כדאי לך להפקיד לקרן ההשתלמות השנה?</h1>
  <p class="cap">4 שאלות קצרות · ללא הרשמה וללא התחייבות</p>
</div>
<div class="side">
  <img src="assets/img/roei-2.jpg" alt="">
  <div class="gold"><strong>רועי רומנו</strong><span>מתכנן פיננסי</span></div>
</div>
</body></html>
